name: CI

on:
  push:
    branches: [main, devel, feat/quotient]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} --extra env --extra dev pytest -v -m "not gpu and not robosuite and not render"
