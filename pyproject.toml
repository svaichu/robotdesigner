[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "robotdesigner"
version = "0.3.0"
description = "Robot embodiments as validated, hashable data, instantiated in batched RL environments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
env = [
    "torch>=2.7",
    "tensordict>=0.14.3,<0.15",
    "torchrl>=0.14.1,<0.15",
    "mujoco>=3.13",
]
warp = ["robotdesigner[env]", "mujoco-warp", "warp-lang>=1.15"]
robosuite = ["robotdesigner[env]", "robosuite>=1.5,<1.6"]
viz = ["imageio", "imageio-ffmpeg", "pillow"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/robotdesigner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device",
    "robosuite: needs the robosuite extra",
    "render: needs an OpenGL context",
]
